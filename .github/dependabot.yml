version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    allow:
      - dependency-name: eclipse-temurin
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
    groups:
      java-base-images:
        patterns: ['eclipse-temurin']
