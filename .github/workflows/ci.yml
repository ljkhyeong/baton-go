name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: 필수 검증
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      KUBERNETES_VERSION: "1.36.1"
      KUBECONFORM_VERSION: "v0.7.0"
      KUBECONFORM_LINUX_AMD64_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
      KUBERNETES_SCHEMA_REVISION: c8f4e61c63bc529749125ac566bccc6986e08d45
      PROMTOOL_IMAGE: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
      ALERTMANAGER_IMAGE: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
      TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
      BATON_GO_APP_IMAGE: baton-go:ci

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Java 21 설정
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Kubernetes CLI 설정
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v${{ env.KUBERNETES_VERSION }}

      - name: Kubeconform 설정
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/kubeconform/bin"
          download_url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          curl --fail --location --silent --show-error \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --retry 3 \
            "$download_url" \
            --output "$archive"
          printf '%s  %s\n' \
            "$KUBECONFORM_LINUX_AMD64_SHA256" \
            "$archive" \
            | sha256sum --check --strict

          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" \
            kubeconform
          chmod 0555 "$install_dir/kubeconform"
          printf '%s\n' "$install_dir" >>"$GITHUB_PATH"

      - name: Kubernetes Kustomize strict schema 검증
        run: |
          set -euo pipefail

          schema_location="https://raw.githubusercontent.com/yannh/kubernetes-json-schema/${KUBERNETES_SCHEMA_REVISION}/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json"

          for target in \
            deploy/k8s/bootstrap \
            deploy/k8s/overlays/private-server \
            deploy/k8s/monitoring-access \
            deploy/k8s/integrations/kube-state-metrics-access
          do
            printf '검증 중: %s\n' "$target"
            kubectl kustomize "$target" \
              | kubeconform \
                  -strict \
                  -summary \
                  -kubernetes-version "$KUBERNETES_VERSION" \
                  -schema-location "$schema_location"
          done

      - name: 배포 이미지 다이제스트 계약 검증
        run: |
          set -euo pipefail

          overlay=deploy/k8s/overlays/private-server
          app_image="$(awk '
            $1 == "-" && $2 == "name:" && $3 == "baton-go" {
              in_app = 1
              next
            }
            in_app && $1 == "newTag:" {
              exit 2
            }
            in_app && $1 == "newName:" {
              name = $2
              next
            }
            in_app && $1 == "digest:" && $2 ~ /^sha256:/ {
              print name "@" $2
              exit
            }
          ' "$overlay/kustomization.yaml")"
          test -n "$app_image"

          app_digest="${app_image##*@}"
          if test "$app_digest" != \
            "sha256:REPLACE_ME_WITH_IMMUTABLE_RELEASE_DIGEST"; then
            printf '%s\n' "$app_digest" \
              | grep -Eq '^sha256:[0-9a-f]{64}$'
          fi

          mysql_image="$(docker compose --env-file .env.example \
            config --images mysql)"
          mysql_digest="${mysql_image##*@}"
          printf '%s\n' "$mysql_digest" \
            | grep -Eq '^sha256:[0-9a-f]{64}$'

          rendered_manifest="$RUNNER_TEMP/baton-go-private-server.yaml"
          kubectl kustomize "$overlay" >"$rendered_manifest"
          test "$(grep -F -c "image: $app_image" "$rendered_manifest")" -eq 2
          test "$(grep -F -c "image: mysql@$mysql_digest" "$rendered_manifest")" -eq 1

      - name: Prometheus 수집 설정·경보 규칙 검증
        run: |
          docker run --rm --network none --read-only \
            --volume "$PWD/deploy/prometheus:/rules:ro" --workdir /rules \
            --entrypoint /bin/promtool "$PROMTOOL_IMAGE" \
            check config --syntax-only prometheus-kubernetes.example.yml prometheus-cert-manager.example.yml prometheus-kube-state-metrics.example.yml
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --volume "$PWD/deploy/prometheus:/rules:ro" --workdir /rules \
            --entrypoint /bin/promtool "$PROMTOOL_IMAGE" \
            check rules baton-go-alerts.yml baton-go-tls-alerts.yml baton-go-monitoring-heartbeat.yml baton-go-kubernetes-alerts.yml
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --volume "$PWD/deploy/prometheus:/rules:ro" --workdir /rules \
            --entrypoint /bin/promtool "$PROMTOOL_IMAGE" \
            test rules baton-go-alerts.test.yml baton-go-availability.test.yml baton-go-tls-alerts.test.yml baton-go-kubernetes-alerts.test.yml

      - name: Discord·Slack 알림 설정·라우팅 검증
        run: |
          set -euo pipefail
          for channel in discord slack; do
            config="/rules/alertmanager-${channel}.example.yml"
            docker run --rm --network none --read-only \
              --volume "$PWD/deploy/prometheus:/rules:ro" \
              --entrypoint /bin/amtool "$ALERTMANAGER_IMAGE" \
              check-config "$config"
            docker run --rm --network none --read-only \
              --volume "$PWD/deploy/prometheus:/rules:ro" \
              --entrypoint /bin/amtool "$ALERTMANAGER_IMAGE" \
              config routes test --config.file="$config" \
              --verify.receivers="${channel}-go" job=baton-go alertname=BatonGoReadinessFailed
            docker run --rm --network none --read-only \
              --volume "$PWD/deploy/prometheus:/rules:ro" \
              --entrypoint /bin/amtool "$ALERTMANAGER_IMAGE" \
              config routes test --config.file="$config" \
              --verify.receivers="${channel}-go" job=baton-go-tls alertname=BatonGoCertificateExpiringSoon
            docker run --rm --network none --read-only \
              --volume "$PWD/deploy/prometheus:/rules:ro" \
              --entrypoint /bin/amtool "$ALERTMANAGER_IMAGE" \
              config routes test --config.file="$config" \
              --verify.receivers="${channel}-go" job=baton-go-kubernetes alertname=BatonGoMigrationFailed
            docker run --rm --network none --read-only \
              --volume "$PWD/deploy/prometheus:/rules:ro" \
              --entrypoint /bin/amtool "$ALERTMANAGER_IMAGE" \
              config routes test --config.file="$config" \
              --verify.receivers=unmatched job=another-service
          done

      - name: Discord·Slack·Healthchecks 웹훅 전달 검증
        timeout-minutes: 3
        run: python3 tools/verify-webhooks.py --output "$RUNNER_TEMP/webhook-verification"

      - name: 감시 시스템 중단 알림 설정·라우팅 검증
        run: |
          set -euo pipefail
          amtool=(docker run --rm --network none --read-only
            --volume "$PWD/deploy/prometheus:/rules:ro"
            --entrypoint /bin/amtool "$ALERTMANAGER_IMAGE")
          config=/rules/alertmanager-healthchecks.example.yml
          "${amtool[@]}" check-config "$config"
          "${amtool[@]}" config routes test --config.file="$config" \
            --verify.receivers=healthchecks-go \
            job=baton-go-monitoring alertname=BatonGoMonitoringHeartbeat
          "${amtool[@]}" config routes test --config.file="$config" \
            --verify.receivers=unmatched job=baton-go alertname=BatonGoReadinessFailed
          "${amtool[@]}" config routes test --config.file="$config" \
            --verify.receivers=unmatched job=another-service alertname=BatonGoMonitoringHeartbeat
          "${amtool[@]}" config routes test --config.file="$config" \
            --verify.receivers=unmatched job=baton-go-monitoring alertname=AnotherAlert

      - name: 정적·단위·패키징 검증
        run: ./gradlew --no-daemon build

      - name: HTTP 계약 산출물 보존
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baton-go-rest-docs
          path: adapter-in-web/build/distributions/baton-go-rest-docs.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Guard 결합 도구 fail-closed 실행 검증
        run: |
          set -euo pipefail

          guard_jar=guard-tool/build/libs/baton-go-guard-binding.jar
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_dir"' EXIT

          printf '%s\n' '00000000-0000-4000-8000-000000000000' \
            >"$smoke_dir/canary.in"
          canary_status=0
          env \
            BATON_GO_LINK_CODE_SECRET=ci-guard-smoke-secret-000000000000 \
            'BATON_GO_DB_URL=jdbc:mysql://127.0.0.1:1/guard_smoke?connectTimeout=100' \
            BATON_GO_DB_USERNAME=guard_smoke \
            BATON_GO_DB_PASSWORD=guard_smoke \
            java -jar "$guard_jar" --confirm-writers-stopped \
            <"$smoke_dir/canary.in" \
            >"$smoke_dir/canary.out" 2>"$smoke_dir/canary.err" \
            || canary_status=$?

          test "$canary_status" -eq 3
          test ! -s "$smoke_dir/canary.out"
          test -s "$smoke_dir/canary.err"
          for sensitive_value in \
            '00000000-0000-4000-8000-000000000000' \
            'ci-guard-smoke-secret-000000000000' \
            'jdbc:mysql://127.0.0.1:1/guard_smoke?connectTimeout=100' \
            guard_smoke; do
            if grep -Fq -- "$sensitive_value" "$smoke_dir/canary.err"; then
              printf '%s\n' 'Guard 오류 출력에 검증용 비밀값이 노출되었습니다.' >&2
              exit 1
            fi
          done

      - name: 운영 이미지 빌드 검증
        run: docker build --tag "$BATON_GO_APP_IMAGE" .

      - name: 이미지 SBOM·취약점 보고서 생성
        id: image_security
        timeout-minutes: 10
        run: |
          set -euo pipefail

          scan_dir="$RUNNER_TEMP/baton-go-image-security"
          reports_dir="$scan_dir/reports"
          archive="$scan_dir/image.tar"
          mkdir -p "$reports_dir" "$scan_dir/cache" "$scan_dir/tmp"
          docker save --output "$archive" "$BATON_GO_APP_IMAGE"
          archive_checksum="$(sha256sum "$archive")"
          trivy=(docker run --rm --read-only
            --env TRIVY_DISABLE_TELEMETRY=true
            --volume "$scan_dir/tmp:/tmp"
            --volume "$archive:/image.tar:ro"
            --volume "$scan_dir/cache:/cache"
            --volume "$reports_dir:/reports")
          "${trivy[@]}" "$TRIVY_IMAGE" image \
            --cache-dir /cache --timeout 5m --skip-version-check --no-progress \
            --offline-scan --scanners vuln --list-all-pkgs --exit-code 0 \
            --format json --output /reports/vulnerabilities.json --input /image.tar
          jq \
            --arg source_commit "$(git rev-parse HEAD)" \
            --arg image_reference "$BATON_GO_APP_IMAGE" \
            --arg docker_image_id "$(docker image inspect --format '{{.Id}}' "$BATON_GO_APP_IMAGE")" \
            --arg image_archive_sha256 "${archive_checksum%% *}" \
            --arg platform "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$BATON_GO_APP_IMAGE")" \
            --arg scanner_image "$TRIVY_IMAGE" \
            '{source_commit: $source_commit, image_reference: $image_reference,
              docker_image_id: $docker_image_id, image_config_digest: .Metadata.ImageID,
              image_archive_sha256: $image_archive_sha256,
              platform: $platform, scanner_image: $scanner_image}' \
            "$reports_dir/vulnerabilities.json" >"$reports_dir/image-metadata.json"
          "${trivy[@]}" --network none "$TRIVY_IMAGE" convert \
            --scanners vuln --format cyclonedx --output /reports/sbom.cdx.json /reports/vulnerabilities.json
          "${trivy[@]}" --network none "$TRIVY_IMAGE" convert \
            --scanners vuln --format table --output /reports/vulnerabilities.txt /reports/vulnerabilities.json
          "${trivy[@]}" --network none "$TRIVY_IMAGE" version \
            --cache-dir /cache --format json >"$reports_dir/scanner.json"

      - name: Java 의존성 제출 보고서 변환
        run: |
          set -euo pipefail
          scan_dir="$RUNNER_TEMP/baton-go-image-security"
          jq --exit-status '
            .Results |= map(select(.Class == "lang-pkgs" and .Type == "jar"))
            | select(any(.Results[]; (.Packages | length) > 0))
          ' "$scan_dir/reports/vulnerabilities.json" >"$scan_dir/java-packages.json"
          docker run --rm --network none --read-only \
            --env GITHUB_REF --env GITHUB_SHA --env GITHUB_WORKFLOW \
            --env GITHUB_JOB --env GITHUB_RUN_ID \
            --volume "$scan_dir/java-packages.json:/input.json:ro" \
            --volume "$scan_dir/reports:/reports" \
            "$TRIVY_IMAGE" convert --format github \
            --output /reports/dependency-graph.json /input.json

      - name: 이미지 SBOM·취약점 보고서 보존
        if: ${{ !cancelled() && steps.image_security.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baton-go-image-security
          path: ${{ runner.temp }}/baton-go-image-security/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: 운영 이미지 기동·상태·공개 오류 응답 검증
        env:
          BATON_GO_MANAGEMENT_JWT_ISSUER_URI: http://127.0.0.1:1/issuer
          BATON_GO_MANAGEMENT_JWT_AUDIENCE: baton-go
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://127.0.0.1:1/issuer/jwks
          BATON_GO_LINK_CODE_SECRET: ci-runtime-link-code-secret-000000000000
          BATON_GO_DB_PASSWORD: ci-runtime-db-password
          BATON_GO_DB_ROOT_PASSWORD: ci-runtime-root-password
          BATON_GO_PUBLIC_RESOLVER_RATE_LIMIT_CAPACITY: "4"
          BATON_GO_PUBLIC_RESOLVER_RATE_LIMIT_WINDOW: 1h
          BATON_GO_HTTP_PORT: "0"
          BATON_GO_MANAGEMENT_PORT: "0"
          BATON_GO_MYSQL_PORT: "0"
          COMPOSE_PROJECT_NAME: baton-go-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          compose=(docker compose --env-file .env.example)

          cleanup() {
            status=$?
            if test "$status" -ne 0; then
              "${compose[@]}" logs --no-color mysql app || true
            fi
            "${compose[@]}" down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          "${compose[@]}" up \
            --no-build \
            --pull missing \
            --wait \
            --wait-timeout 180

          app_container="$("${compose[@]}" ps --quiet app)"
          test "$(docker inspect --format '{{.Config.User}}' "$app_container")" = "10001:10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$app_container")" = "true"
          test "$(docker inspect --format '{{index .HostConfig.Tmpfs "/tmp"}}' "$app_container")" = \
            "rw,noexec,nosuid,nodev,size=64m,mode=1777"
          docker exec "$app_container" sh -c \
            'test ! -w /opt/baton-go/baton-go.jar && test -w /tmp'
          docker exec "$app_container" wget -q -T 2 -O /dev/null \
            http://127.0.0.1:8080/livez
          docker exec "$app_container" wget -q -T 2 -O /dev/null \
            http://127.0.0.1:8080/readyz
          http_address="$("${compose[@]}" port app 8080)"
          monitor=deploy/uptime/hetrixtools-go.example.json
          monitor_target="$(jq --exit-status --raw-output '.Target' "$monitor")"
          public_url="http://$http_address/${monitor_target#https://go.b4ton.com/}"
          monitor_keyword="$(jq --exit-status --raw-output '.Keyword' "$monitor")"
          html_headers="$RUNNER_TEMP/baton-go-public-html.headers"
          html_body="$RUNNER_TEMP/baton-go-public.html"
          response_status="$(curl --silent --show-error --max-time 5 \
            --header 'Accept: text/html' --header 'X-Request-Id: ci-public-html' \
            --dump-header "$html_headers" --output "$html_body" \
            --write-out '%{http_code}' "$public_url")"
          test "$response_status" = "404"
          grep -Eiq '^content-type: text/html;[[:space:]]*charset=utf-8[[:space:]]*$' "$html_headers"
          grep -Fq '<html lang="ko">' "$html_body"
          grep -Fq "$monitor_keyword" "$html_body"
          grep -Fq '<code>ci-public-html</code>' "$html_body"

          json_headers="$RUNNER_TEMP/baton-go-public-json.headers"
          json_body="$RUNNER_TEMP/baton-go-public.json"
          response_status="$(curl --silent --show-error --max-time 5 \
            --header 'X-Request-Id: ci-public-json' \
            --dump-header "$json_headers" --output "$json_body" \
            --write-out '%{http_code}' "$public_url")"
          test "$response_status" = "404"
          test "$response_status" = "$(jq --raw-output '.HTTPCodes' "$monitor")"
          grep -Eiq '^content-type: application/json[[:space:]]*$' "$json_headers"
          jq --exit-status \
            '.code == "LINK_NOT_FOUND" and .requestId == "ci-public-json"' \
            "$json_body"
          grep -Fq "$monitor_keyword" "$json_body"

          head_headers="$RUNNER_TEMP/baton-go-public-head.headers"
          for content_type in 'text/html;charset=UTF-8' 'application/json'; do
            response_metadata="$(curl --silent --show-error --max-time 5 --head \
              --header "Accept: ${content_type%%;*}" \
              --dump-header "$head_headers" --output /dev/null \
              --write-out '%{http_code} %{size_download}' "$public_url")"
            test "$response_metadata" = "404 0"
            grep -Fiq "content-type: $content_type" "$head_headers"
          done

          response_status="$(curl --silent --show-error --max-time 5 \
            --output /dev/null --write-out '%{http_code}' "$public_url")"
          test "$response_status" = "429"

          metrics_file="$RUNNER_TEMP/baton-go-prometheus.txt"
          docker exec "$app_container" wget -q -T 2 -O - \
            http://127.0.0.1:8081/actuator/prometheus >"$metrics_file"
          grep -Eq '^baton_go_public_resolver_target_contract_violations_total 0(\.0)?$' "$metrics_file"
          grep -Eq '^baton_go_management_authentication_service_failures_total 0(\.0)?$' "$metrics_file"
          for recovery_code in \
            LINK_CREATION_REPLAY_UNAVAILABLE \
            LINK_CODE_REPLAY_UNAVAILABLE \
            LINK_CODE_CONFIGURATION_MISMATCH \
            PUBLIC_LINK_ORIGIN_REPLAY_UNAVAILABLE; do
            grep '^baton_go_management_link_recovery_failures_total{' "$metrics_file" \
              | grep -F "code=\"$recovery_code\"" \
              | grep -Eq '} 0(\.0)?$'
          done
          grep '^http_server_requests_seconds_count{' "$metrics_file" \
            | grep -F 'uri="/l/{code}"' \
            | grep -F 'method="GET"' \
            | grep -F 'status="429"' \
            | grep -Eq '} [1-9][0-9]*(\.0)?$'
          for boundary in '1.0' '2.0'; do
            grep '^http_server_requests_seconds_bucket{' "$metrics_file" \
              | grep -F 'uri="/l/{code}"' \
              | grep -Fq "le=\"$boundary\""
          done

          "${compose[@]}" run --rm --no-deps app \
            --baton-go.migration-only=true \
            --logging.level.root=OFF

      - name: MySQL 통합 검증
        run: ./gradlew --no-daemon :bootstrap:mysqlTest :bootstrap:redisTest

      - name: 검증한 운영 이미지 GHCR 게시
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 5
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/baton-go-image-security/reports/image-metadata.json"
          image_id="$(docker image inspect --format '{{.Id}}' "$BATON_GO_APP_IMAGE")"
          jq --exit-status --arg image_id "$image_id" --arg source_commit "$GITHUB_SHA" \
            '.docker_image_id == $image_id and .source_commit == $source_commit' \
            "$metadata" >/dev/null

          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/baton-go-registry.XXXXXX")"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$BATON_GO_APP_IMAGE" "$image"
          docker push "$image"
          reference="$(docker image inspect --format '{{json .RepoDigests}}' "$image" \
            | jq --exit-status --raw-output --arg repository "$repository" '
                map(select(startswith($repository + "@sha256:"))) | unique
                | if length == 1 then .[0] else error("게시 다이제스트를 확인할 수 없습니다") end
              ')"

          publication_dir="$RUNNER_TEMP/baton-go-image-publication"
          mkdir -p "$publication_dir"
          jq --arg image_tag "$image" --arg image_reference "$reference" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {image_tag: $image_tag, image_reference: $image_reference,
              workflow_run: $workflow_run, run_attempt: $run_attempt}' \
            "$metadata" >"$publication_dir/image-publication.json"
          {
            printf '### GHCR 이미지 게시\n\n'
            printf -- '- 이미지: %s\n' "$reference"
            printf -- '- 소스 커밋: %s\n' "$GITHUB_SHA"
            printf -- '- 플랫폼: %s\n' "$(jq --raw-output '.platform' "$metadata")"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 게시 이미지 다이제스트 보존
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baton-go-image-publication
          path: ${{ runner.temp }}/baton-go-image-publication/image-publication.json
          if-no-files-found: error
          retention-days: 14

      - name: 실패한 테스트 보고서 보존
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baton-go-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            ${{ runner.temp }}/webhook-verification/*.log
            ${{ runner.temp }}/webhook-verification/report.json
          if-no-files-found: ignore
          retention-days: 14

  dependency-submission:
    name: Java 의존성 알림 연동
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 검증한 이미지 보고서 받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baton-go-image-security
          path: image-security

      - name: GitHub 의존성 API 제출
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input image-security/dependency-graph.json \
            --jq '"의존성 제출 완료: \(.id)"'
