name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    name: 필수 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KUBERNETES_VERSION: "1.36.1"
      KUBECONFORM_VERSION: "v0.7.0"
      KUBECONFORM_LINUX_AMD64_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
      KUBERNETES_SCHEMA_REVISION: c8f4e61c63bc529749125ac566bccc6986e08d45

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: Java 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: Kubernetes CLI 설정
        uses: azure/setup-kubectl@v5
        with:
          version: v${{ env.KUBERNETES_VERSION }}

      - name: Kubeconform 설정
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/kubeconform/bin"
          download_url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          curl --fail --location --silent --show-error \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --retry 3 \
            "$download_url" \
            --output "$archive"
          printf '%s  %s\n' \
            "$KUBECONFORM_LINUX_AMD64_SHA256" \
            "$archive" \
            | sha256sum --check --strict

          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" \
            kubeconform
          chmod 0555 "$install_dir/kubeconform"
          printf '%s\n' "$install_dir" >>"$GITHUB_PATH"

      - name: Kubernetes Kustomize strict schema 검증
        shell: bash
        run: |
          set -euo pipefail

          schema_location="https://raw.githubusercontent.com/yannh/kubernetes-json-schema/${KUBERNETES_SCHEMA_REVISION}/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json"

          for target in \
            deploy/k8s/bootstrap \
            deploy/k8s/overlays/private-server
          do
            printf '검증 중: %s\n' "$target"
            kubectl kustomize "$target" \
              | kubeconform \
                  -strict \
                  -summary \
                  -kubernetes-version "$KUBERNETES_VERSION" \
                  -schema-location "$schema_location"
          done

      - name: 정적·단위·패키징 검증
        run: ./gradlew --no-daemon build

      - name: Guard 결합 도구 fail-closed 실행 검증
        shell: bash
        run: |
          set -euo pipefail

          guard_jar=guard-tool/build/libs/baton-go-guard-binding.jar
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_dir"' EXIT

          usage_status=0
          java -jar "$guard_jar" </dev/null \
            >"$smoke_dir/usage.out" 2>"$smoke_dir/usage.err" \
            || usage_status=$?

          test "$usage_status" -eq 2
          test ! -s "$smoke_dir/usage.out"
          test -s "$smoke_dir/usage.err"

          canary_status=0
          env \
            BATON_GO_LINK_CODE_SECRET=ci-guard-smoke-secret-000000000000 \
            'BATON_GO_DB_URL=jdbc:mysql://127.0.0.1:1/guard_smoke?connectTimeout=100' \
            BATON_GO_DB_USERNAME=guard_smoke \
            BATON_GO_DB_PASSWORD=guard_smoke \
            java -jar "$guard_jar" --confirm-writers-stopped </dev/null \
            >"$smoke_dir/canary.out" 2>"$smoke_dir/canary.err" \
            || canary_status=$?

          test "$canary_status" -eq 3
          test ! -s "$smoke_dir/canary.out"
          test -s "$smoke_dir/canary.err"

          printf '%s\n' '00000000-0000-4000-8000-000000000000' \
            >"$smoke_dir/canary.in"
          configuration_status=0
          env \
            -u BATON_GO_LINK_CODE_SECRET \
            -u BATON_GO_DB_URL \
            -u BATON_GO_DB_USERNAME \
            -u BATON_GO_DB_PASSWORD \
            java -jar "$guard_jar" --confirm-writers-stopped \
            <"$smoke_dir/canary.in" \
            >"$smoke_dir/configuration.out" \
            2>"$smoke_dir/configuration.err" \
            || configuration_status=$?

          test "$configuration_status" -eq 3
          test ! -s "$smoke_dir/configuration.out"
          test -s "$smoke_dir/configuration.err"

      - name: 운영 이미지 빌드 검증
        run: docker build --tag baton-go:ci .

      - name: 운영 이미지 기동과 health 검증
        shell: bash
        env:
          BATON_GO_APP_IMAGE: baton-go:ci
          BATON_GO_MANAGEMENT_TOKEN: ci-runtime-management-token-000000000000
          BATON_GO_LINK_CODE_SECRET: ci-runtime-link-code-secret-000000000000
          BATON_GO_DB_PASSWORD: ci-runtime-db-password
          BATON_GO_DB_ROOT_PASSWORD: ci-runtime-root-password
          BATON_GO_HTTP_PORT: "0"
          BATON_GO_MANAGEMENT_PORT: "0"
          BATON_GO_MYSQL_PORT: "0"
          COMPOSE_PROJECT_NAME: baton-go-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          compose=(docker compose --env-file .env.example)

          cleanup() {
            status=$?
            if test "$status" -ne 0; then
              "${compose[@]}" logs --no-color mysql app || true
            fi
            "${compose[@]}" down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          "${compose[@]}" up \
            --detach \
            --no-build \
            --pull missing \
            --wait \
            --wait-timeout 180

          app_container="$("${compose[@]}" ps --quiet app)"
          test -n "$app_container"
          test "$(docker inspect --format '{{.Config.User}}' "$app_container")" = "10001:10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$app_container")" = "true"
          test "$(docker inspect --format '{{index .HostConfig.Tmpfs "/tmp"}}' "$app_container")" = \
            "rw,noexec,nosuid,nodev,size=64m,mode=1777"
          docker exec "$app_container" sh -c \
            'test ! -w /opt/baton-go/baton-go.jar && test -w /tmp'

      - name: MySQL 통합 검증
        run: ./gradlew --no-daemon :bootstrap:mysqlTest
