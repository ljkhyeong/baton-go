name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    name: 필수 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: Java 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 정적·단위·패키징 검증
        run: ./gradlew --no-daemon build

      - name: Compose 설정 검증
        run: docker compose --env-file .env.example config --quiet

      - name: 운영 이미지 빌드 검증
        run: docker build --tag baton-go:ci .

      - name: MySQL 통합 검증
        run: ./gradlew --no-daemon :bootstrap:mysqlTest
