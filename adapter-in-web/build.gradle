dependencies {
	implementation project(':application')
	implementation project(':domain')

	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'io.micrometer:micrometer-core'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.springframework.security:spring-security-test'
}

def apiContractSnippets = layout.buildDirectory.dir('generated-snippets')

tasks.named('test') {
	outputs.dir apiContractSnippets
}

tasks.register('apiContractDocs', Zip) {
	group = 'documentation'
	description = '테스트에서 생성한 HTTP 계약 조각을 묶습니다.'
	dependsOn tasks.named('test')
	from apiContractSnippets
	archiveFileName = 'baton-go-rest-docs.zip'
	destinationDirectory = layout.buildDirectory.dir('distributions')
}

tasks.named('check') {
	dependsOn tasks.named('apiContractDocs')
}
