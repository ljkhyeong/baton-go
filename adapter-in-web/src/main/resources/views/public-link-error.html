<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>%1$s · BATON GO</title>
    <style>
        :root {
            color-scheme: light;
            --paper: #f0f5fc;
            --surface: #ffffff;
            --ink: #172d4d;
            --muted: #526882;
            --accent: #2864c6;
            --line: #cbd9ec;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 2rem 1.25rem;
            color: var(--ink);
            background: var(--paper);
            font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            line-height: 1.7;
            word-break: keep-all;
        }
        main {
            width: min(54rem, calc(100vw - 2.5rem));
            display: grid;
            grid-template-columns: 9rem 1fr;
            background: var(--surface);
            border-top: 4px solid var(--accent);
        }
        .brand {
            padding: 2.75rem 1.5rem;
            border-right: 1px solid var(--line);
            color: var(--accent);
            font-family: "SFMono-Regular", Consolas, monospace;
            line-height: 1.1;
        }
        .brand span { display: block; font-size: .8rem; letter-spacing: .2em; }
        .brand strong { display: block; margin-top: .5rem; font-size: 3.4rem; letter-spacing: -.08em; }
        .message { padding: clamp(2rem, 5vw, 3.5rem); }
        .label { margin: 0 0 1rem; color: var(--accent); font-size: .85rem; font-weight: 700; }
        h1 { margin: 0; font-size: clamp(1.6rem, 3.5vw, 2.1rem); line-height: 1.45; letter-spacing: -.04em; }
        .guidance { margin: 1.25rem 0 1.5rem; color: var(--muted); font-size: 1rem; }
        .retry {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: .65rem 1.15rem;
            color: var(--surface);
            background: var(--accent);
            border-radius: .25rem;
            font-weight: 700;
            text-decoration: none;
        }
        .retry:hover { background: #1d4d9c; }
        .retry:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
        footer { padding-top: 1.25rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
        footer p { margin: 0 0 .4rem; }
        code { font-family: "SFMono-Regular", Consolas, monospace; font-size: .75rem; overflow-wrap: anywhere; word-break: break-all; }
        @media (max-width: 540px) {
            main { grid-template-columns: 1fr; }
            .brand { padding: 1.25rem 1.75rem; border-right: 0; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: .75rem; }
            .brand strong { margin: 0; font-size: 1.65rem; }
            .message { padding: 2rem 1.75rem; }
        }
    </style>
</head>
<body>
<main>
    <div class="brand" aria-label="BATON GO"><span>BATON</span><strong>GO</strong></div>
    <section class="message" aria-labelledby="error-title">
        <p class="label">링크 안내</p>
        <h1 id="error-title">%1$s</h1>
        <p class="guidance">%2$s</p>
        %4$s
        <footer>
            <p>문의할 때 아래 요청 번호를 함께 전달해 주세요.</p>
            <code>%3$s</code>
        </footer>
    </section>
</main>
</body>
</html>
