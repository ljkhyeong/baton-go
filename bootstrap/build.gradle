plugins {
	id 'org.springframework.boot'
}

dependencies {
	implementation project(':domain')
	implementation project(':application')
	implementation project(':adapter-in-web')
	implementation project(':adapter-out-persistence')
	implementation project(':adapter-out-external')

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
}

tasks.named('bootJar') {
	archiveFileName = 'baton-go.jar'
}

tasks.register(
		'guardBindingToolJar',
		org.springframework.boot.gradle.tasks.bundling.BootJar
) {
	group = 'build'
	description = 'Builds the one-shot existing-database HMAC guard binding tool.'
	archiveFileName = 'baton-go-guard-binding.jar'
	mainClass = 'com.personal.batongo.bootstrap.guard.LinkCodeKeyGuardBindingCli'
	classpath = sourceSets.main.runtimeClasspath
	targetJavaVersion = JavaVersion.VERSION_21
}

tasks.named('assemble') {
	dependsOn tasks.named('guardBindingToolJar')
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'mysql'
	}
}

tasks.register('mysqlTest', Test) {
	group = 'verification'
	description = 'Runs MySQL Testcontainers integration tests.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'mysql'
	}
	shouldRunAfter tasks.named('test')
}
