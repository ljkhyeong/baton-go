plugins {
	id 'org.springframework.boot'
}

dependencies {
	implementation project(':domain')
	implementation project(':application')
	implementation project(':adapter-in-web')
	implementation project(':adapter-out-persistence')
	implementation project(':adapter-out-external')

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-security-oauth2-resource-server'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation project(':guard-tool')
}

tasks.named('bootJar') {
	archiveFileName = 'baton-go.jar'
}

tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'mysql'
	}
}

tasks.register('mysqlTest', Test) {
	group = 'verification'
	description = 'MySQL Testcontainers 통합 테스트를 실행합니다.'
	inputs.file rootProject.file('deploy/k8s/base/mysql-runtime-user-init.sh')
	inputs.file rootProject.file('compose.yml')
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'batonGo.repositoryRoot', rootProject.projectDir.absolutePath
	systemProperty 'jdk.net.hosts.file', file(
			'src/test/resources/com/personal/batongo/bootstrap/mysql/hosts'
	).absolutePath
	useJUnitPlatform {
		includeTags 'mysql'
	}
	shouldRunAfter tasks.named('test')
}
