server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: baton-go
  datasource:
    url: ${BATON_GO_DB_URL:jdbc:mysql://localhost:3307/baton_go?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${BATON_GO_DB_USERNAME:baton_go}
    password: ${BATON_GO_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

baton-go:
  public-base-url: ${BATON_GO_PUBLIC_BASE_URL:http://localhost:8080}
  management:
    token: ${BATON_GO_MANAGEMENT_TOKEN:}
  targets:
    baton-base-url: ${BATON_GO_BATON_BASE_URL:http://localhost:5173}
    round-base-url: ${BATON_GO_ROUND_BASE_URL:http://localhost:5174}
