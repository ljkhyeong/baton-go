spring:
  application:
    name: baton-go
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BATON_GO_MANAGEMENT_JWT_ISSUER_URI}
          audiences: ${BATON_GO_MANAGEMENT_JWT_AUDIENCE:baton-go}
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  datasource:
    url: ${BATON_GO_DB_URL:jdbc:mysql://localhost:3307/baton_go?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${BATON_GO_DB_USERNAME:baton_go}
    password: ${BATON_GO_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 5000
        trustCertificateKeyStorePassword: baton-go-public-ca-v1
  flyway:
    validate-migration-naming: true
    fail-on-missing-locations: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful

management:
  metrics:
    distribution:
      slo:
        http.server.requests: 1s,2s
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db,resolverQuotaRedis

baton-go:
  public-base-url: ${BATON_GO_PUBLIC_BASE_URL}
  management-jwk:
    connect-timeout: ${BATON_GO_MANAGEMENT_JWK_CONNECT_TIMEOUT:3s}
    read-timeout: ${BATON_GO_MANAGEMENT_JWK_READ_TIMEOUT:5s}
  distributed-resolver-quota:
    enabled: ${BATON_GO_DISTRIBUTED_RESOLVER_QUOTA_ENABLED:false}
    redis-uri: ${BATON_GO_REDIS_URI:}
    capacity: ${BATON_GO_DISTRIBUTED_RESOLVER_QUOTA_CAPACITY:300}
    window: ${BATON_GO_DISTRIBUTED_RESOLVER_QUOTA_WINDOW:1m}
    timeout: ${BATON_GO_DISTRIBUTED_RESOLVER_QUOTA_TIMEOUT:500ms}
  link-retention:
    enabled: ${BATON_GO_LINK_RETENTION_ENABLED:false}
    period: ${BATON_GO_LINK_RETENTION_PERIOD:}
    batch-size: ${BATON_GO_LINK_RETENTION_BATCH_SIZE:100}
    interval: ${BATON_GO_LINK_RETENTION_INTERVAL:60s}
  link-code:
    secret: ${BATON_GO_LINK_CODE_SECRET:}
  target-contract-operations:
    enabled: ${BATON_GO_TARGET_CONTRACT_OPERATIONS_ENABLED:false}
    private-ingress-confirmed: ${BATON_GO_TARGET_CONTRACT_OPERATIONS_PRIVATE_INGRESS_CONFIRMED:false}
  public-resolver-rate-limit:
    capacity: ${BATON_GO_PUBLIC_RESOLVER_RATE_LIMIT_CAPACITY:300}
    window: ${BATON_GO_PUBLIC_RESOLVER_RATE_LIMIT_WINDOW:1m}
  targets:
    baton-base-url: ${BATON_GO_BATON_BASE_URL:http://localhost:5173}
    round-base-url: ${BATON_GO_ROUND_BASE_URL:http://localhost:5174}
