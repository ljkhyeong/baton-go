import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
	id 'org.springframework.boot' version '4.1.1' apply false
}

allprojects {
	group = 'com.personal'
	version = '0.1.0-SNAPSHOT'
	description = 'BATON·ROUND용 단축 링크 서비스'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java-library'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.compilerArgs << '-parameters'
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
		testLogging {
			events 'passed', 'skipped', 'failed'
			exceptionFormat = 'full'
		}
	}

	// Spring Boot 4.1.1이 관리하는 버전의 보안 수정본을 쓴다. 이 버전을 포함한 Boot 패치로 올리면 지운다.
	configurations.configureEach {
		resolutionStrategy.eachDependency { details ->
			if (details.requested.group == 'org.apache.tomcat.embed') {
				details.useVersion '11.0.26'
				details.because 'tomcat-embed-core 11.0.25 미만 보안 취약점 수정'
			} else if (details.requested.group.startsWith('tools.jackson')) {
				details.useVersion '3.1.7'
				details.because 'jackson-core·jackson-databind 3.1.7 미만 보안 취약점 수정'
			}
		}
	}

	dependencies {
		implementation enforcedPlatform(SpringBootPlugin.BOM_COORDINATES)
		annotationProcessor enforcedPlatform(SpringBootPlugin.BOM_COORDINATES)
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}
}
