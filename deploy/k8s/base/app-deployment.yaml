apiVersion: apps/v1
kind: Deployment
metadata:
  name: baton-go
  labels:
    app.kubernetes.io/name: baton-go
    app.kubernetes.io/component: application
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: baton-go
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baton-go
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: baton-go:local
          envFrom:
            - configMapRef:
                name: baton-go-config
          env:
            - name: BATON_GO_LINK_CODE_SECRET
              valueFrom:
                secretKeyRef:
                  name: baton-go-link-code-secret
                  key: BATON_GO_LINK_CODE_SECRET
            - name: BATON_GO_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: baton-go-database-identity
                  key: BATON_GO_DB_USERNAME
            - name: BATON_GO_DB_URL
              valueFrom:
                secretKeyRef:
                  name: baton-go-database-client-config
                  key: BATON_GO_DB_URL
            - name: BATON_GO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baton-go-database-runtime-credentials
                  key: BATON_GO_DB_PASSWORD
          ports:
            - name: http
              containerPort: 8080
            - name: actuator
              containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: mysql-client-tls
              mountPath: /etc/baton-go/mysql-tls
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: mysql-client-tls
          secret:
            secretName: baton-go-mysql-client-tls
            defaultMode: 0440
            items:
              - key: truststore.p12
                path: truststore.p12
