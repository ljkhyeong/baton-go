apiVersion: batch/v1
kind: Job
metadata:
  name: baton-go-database-migration
  labels:
    app.kubernetes.io/name: baton-go
    app.kubernetes.io/component: database-migration
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baton-go
        app.kubernetes.io/component: database-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: baton-go:local
          args:
            - --baton-go.migration-only=true
          env:
            - name: BATON_GO_DB_URL
              valueFrom:
                secretKeyRef:
                  name: baton-go-database-client-config
                  key: BATON_GO_DB_URL
            - name: BATON_GO_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: baton-go-database-identity
                  key: BATON_GO_DB_MIGRATION_USERNAME
            - name: BATON_GO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baton-go-database-migration-credentials
                  key: BATON_GO_DB_MIGRATION_PASSWORD
            - name: TZ
              value: UTC
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: mysql-client-tls
              mountPath: /etc/baton-go/mysql-tls
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: mysql-client-tls
          secret:
            secretName: baton-go-mysql-client-tls
            defaultMode: 0440
            items:
              - key: truststore.p12
                path: truststore.p12
