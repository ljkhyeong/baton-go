apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: baton-go-mysql-init-preflight
    files:
      - mysql-init-preflight.sh
    options:
      labels:
        app.kubernetes.io/name: baton-go
        app.kubernetes.io/component: database

resources:
  - service-account.yaml
  - database-identity-config.yaml
  - mysql-runtime-user-init-config.yaml
  - database-migration-job.yaml
  - app-deployment.yaml
  - app-service.yaml
  - app-network-policy.yaml
  - mysql-service.yaml
  - mysql-statefulset.yaml
  - mysql-network-policy.yaml
