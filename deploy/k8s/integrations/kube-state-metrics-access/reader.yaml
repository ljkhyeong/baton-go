# GO 전용 kube-state-metrics에 조회 권한이 없을 때만 적용한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: baton-go-kube-state-metrics-reader
  namespace: baton-go
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: baton-go-kube-state-metrics-reader
  namespace: baton-go
subjects:
  # 실제 kube-state-metrics의 ServiceAccount 이름·Namespace로 변경한다.
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: baton-go-kube-state-metrics-reader
