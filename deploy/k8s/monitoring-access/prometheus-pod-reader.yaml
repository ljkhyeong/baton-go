apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: baton-go-prometheus-pod-reader
  namespace: baton-go
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: baton-go-prometheus-pod-reader
  namespace: baton-go
subjects:
  # 기존 Prometheus의 ServiceAccount 이름과 Namespace로 변경한다.
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: baton-go-prometheus-pod-reader

