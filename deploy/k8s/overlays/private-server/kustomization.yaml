apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: baton-go

resources:
  - ../../base

configMapGenerator:
  - name: baton-go-config
    envs:
      - app-config.properties

images:
  - name: baton-go
    newName: registry.invalid/baton-go
    digest: sha256:REPLACE_ME_WITH_IMMUTABLE_RELEASE_DIGEST
  - name: mysql
    digest: sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb

patches:
  - path: app-private-registry-patch.yaml
  - path: migration-private-registry-patch.yaml
