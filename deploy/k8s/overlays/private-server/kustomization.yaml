apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: baton-go

resources:
  - ../../base

configMapGenerator:
  - name: baton-go-config
    envs:
      - app-config.properties

images:
  - name: baton-go
    newName: registry.invalid/baton-go
    digest: sha256:REPLACE_ME_WITH_IMMUTABLE_RELEASE_DIGEST
  - name: mysql
    digest: sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6

patches:
  - path: app-private-registry-patch.yaml
  - path: migration-private-registry-patch.yaml
