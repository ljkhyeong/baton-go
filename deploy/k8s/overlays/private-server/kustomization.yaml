apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: baton-go

resources:
  - ../../base

configMapGenerator:
  - name: baton-go-config
    envs:
      - app-config.properties

images:
  - name: baton-go
    newName: registry.invalid/baton-go
    digest: sha256:REPLACE_ME_WITH_IMMUTABLE_RELEASE_DIGEST
  - name: mysql
    digest: sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7

patches:
  - path: app-private-registry-patch.yaml
  - path: migration-private-registry-patch.yaml
