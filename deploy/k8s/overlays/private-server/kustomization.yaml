apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: baton-go

resources:
  - ../../base

configMapGenerator:
  - name: baton-go-config
    envs:
      - app-config.properties

images:
  - name: baton-go
    newName: registry.invalid/baton-go
    digest: sha256:REPLACE_ME_WITH_IMMUTABLE_RELEASE_DIGEST
  - name: mysql
    digest: sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70

patches:
  - path: app-private-registry-patch.yaml
  - path: migration-private-registry-patch.yaml
