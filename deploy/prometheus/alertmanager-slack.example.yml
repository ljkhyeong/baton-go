# GO 전용 예시다. 공용 Alertmanager에는 하위 route와 slack-go receiver만 병합한다.
route:
  receiver: unmatched
  routes:
    - matchers: ['job=~"baton-go|baton-go-tls"']
      receiver: slack-go
      group_by: [job, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

receivers:
  - name: unmatched
  - name: slack-go
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        send_resolved: true
        title: '[{{ .Status }}] BATON GO · {{ .GroupLabels.alertname }}'
        title_link: ''
        fallback: '[{{ .Status }}] BATON GO · {{ .GroupLabels.alertname }}'
        text: |-
          발생: {{ len .Alerts.Firing }}건 / 해제: {{ len .Alerts.Resolved }}건
          {{ .CommonAnnotations.summary }}
        footer: ''
        http_config:
          follow_redirects: false
