groups:
  - name: baton-go
    interval: 30s
    rules:
      - alert: BatonGoPublicResolverLatency
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="baton-go",uri="/l/{code}",method=~"GET|HEAD",status!="429",le="1.0"}[5m]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="baton-go",uri="/l/{code}",method=~"GET|HEAD",status!="429"}[5m]))
          ) < 0.95
          and
          sum by (job) (increase(http_server_requests_seconds_count{job="baton-go",uri="/l/{code}",method=~"GET|HEAD",status!="429"}[5m])) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: BATON GO 공개 링크 응답 지연
          description: 최근 5분 공개 링크 요청이 100건 이상이고 1초 초과 응답 비율이 5%를 넘는 상태가 5분간 지속되었습니다. DB 연결 풀과 쿼리 지연, 최근 배포를 확인하세요.

      - alert: BatonGoManagementApiLatency
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="baton-go",uri=~"/api/v1/.*",status!="429",le="2.0"}[5m]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="baton-go",uri=~"/api/v1/.*",status!="429"}[5m]))
          ) < 0.95
          and
          sum by (job) (increase(http_server_requests_seconds_count{job="baton-go",uri=~"/api/v1/.*",status!="429"}[5m])) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: BATON GO 관리 API 응답 지연
          description: 최근 5분 관리 API 요청이 20건 이상이고 2초 초과 응답 비율이 5%를 넘는 상태가 5분간 지속되었습니다. DB 잠금과 연결 풀, JWK 조회 지연을 확인하세요.

      - alert: BatonGoHttpServerErrors
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_count{job="baton-go",status=~"5..",uri!~"/actuator.*|/livez|/readyz"}[5m]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="baton-go",status!="429",uri!~"/actuator.*|/livez|/readyz"}[5m]))
          ) > 0.05
          and
          sum by (job) (increase(http_server_requests_seconds_count{job="baton-go",status=~"5..",uri!~"/actuator.*|/livez|/readyz"}[5m])) >= 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: BATON GO 서버 오류 증가
          description: 최근 5분간 5xx가 5건 이상이고 429를 제외한 응답의 오류율이 5%를 넘는 상태가 5분간 지속되었습니다. DB 준비 상태와 최근 배포를 확인하세요.

      - alert: BatonGoManagementAuthenticationServiceFailure
        expr: |
          sum by (job) (increase(baton_go_management_authentication_service_failures_total{job="baton-go"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: BATON GO 관리 인증 서비스 장애
          description: 최근 5분간 관리 JWT 검증 서비스 장애가 관측되었습니다. requestId로 로그를 확인하고 발급자 상태와 Pod의 JWK HTTPS 접근을 점검하세요.

      - alert: BatonGoPublicResolverRateLimited
        expr: |
          sum by (job) (increase(http_server_requests_seconds_count{job="baton-go",method=~"GET|HEAD",status="429"}[5m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: BATON GO 공개 링크 요청 제한 지속
          description: 최근 5분간 GET·HEAD의 429가 10건 이상인 상태가 5분간 지속되었습니다. 유입량과 Ingress·인스턴스 요청률 제한을 확인하세요.

      - alert: BatonGoStoredTargetContractViolation
        expr: |
          sum by (job) (increase(baton_go_public_resolver_target_contract_violations_total{job="baton-go"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: BATON GO 저장 대상 계약 위반
          description: 공개 링크 해석 중 저장된 대상 계약 위반이 발생했습니다. 허용된 linkId·requestId로 로그를 확인하고 대상 계약 정리 절차를 따르세요.
