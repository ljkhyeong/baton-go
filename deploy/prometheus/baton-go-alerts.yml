groups:
  - name: baton-go
    interval: 30s
    rules:
      - alert: BatonGoMetricsScrapeFailed
        expr: up{job="baton-go"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: BATON GO 지표 수집 실패
          description: 2분간 Pod 지표를 수집하지 못했습니다. Pod 상태와 Actuator 접근 권한, 네트워크를 확인하세요.

      - alert: BatonGoMetricsTargetMissing
        expr: absent(up{job="baton-go"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: BATON GO 지표 수집 대상 없음
          description: 2분간 지표 수집 대상이 없습니다. 배포 상태와 Prometheus의 Pod 조회 권한, 수집 설정을 확인하세요.

      - alert: BatonGoReadinessFailed
        expr: |
          (
            sum by (job, instance) (rate(http_server_requests_seconds_count{job="baton-go",method="GET",uri="/readyz",status="503"}[2m]))
            /
            sum by (job, instance) (rate(http_server_requests_seconds_count{job="baton-go",method="GET",uri="/readyz"}[2m]))
          ) > 0.5
          and
          sum by (job, instance) (increase(http_server_requests_seconds_count{job="baton-go",method="GET",uri="/readyz"}[2m])) >= 12
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: BATON GO 준비 상태 실패
          description: 2분간 {{ $labels.instance }} Pod의 준비 상태 503 비율이 50%를 넘었습니다. DB와 분산 요청 제한 Redis 연결, 최근 배포를 확인하세요.

      - alert: BatonGoPublicResolverLatency
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="baton-go",uri="/l/{code}",method=~"GET|HEAD",status!="429",le="1.0"}[5m]))
            /
            sum by (job) (
              rate(http_server_requests_seconds_count{job="baton-go",uri="/l/{code}",method=~"GET|HEAD",status!="429"}[5m])
              and ignoring (le)
              rate(http_server_requests_seconds_bucket{job="baton-go",uri="/l/{code}",method=~"GET|HEAD",status!="429",le="1.0"}[5m])
            )
          ) < 0.95
          and
          sum by (job) (
            increase(http_server_requests_seconds_count{job="baton-go",uri="/l/{code}",method=~"GET|HEAD",status!="429"}[5m])
            and ignoring (le)
            rate(http_server_requests_seconds_bucket{job="baton-go",uri="/l/{code}",method=~"GET|HEAD",status!="429",le="1.0"}[5m])
          ) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: BATON GO 공개 링크 응답 지연
          description: 최근 5분 공개 링크 요청이 100건 이상이고 1초 초과 응답 비율이 5%를 넘는 상태가 5분간 지속되었습니다. DB 연결 풀과 쿼리 지연, 최근 배포를 확인하세요.

      - alert: BatonGoManagementApiLatency
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="baton-go",uri=~"/api/v1/.*",status!="429",le="2.0"}[5m]))
            /
            sum by (job) (
              rate(http_server_requests_seconds_count{job="baton-go",uri=~"/api/v1/.*",status!="429"}[5m])
              and ignoring (le)
              rate(http_server_requests_seconds_bucket{job="baton-go",uri=~"/api/v1/.*",status!="429",le="2.0"}[5m])
            )
          ) < 0.95
          and
          sum by (job) (
            increase(http_server_requests_seconds_count{job="baton-go",uri=~"/api/v1/.*",status!="429"}[5m])
            and ignoring (le)
            rate(http_server_requests_seconds_bucket{job="baton-go",uri=~"/api/v1/.*",status!="429",le="2.0"}[5m])
          ) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: BATON GO 관리 API 응답 지연
          description: 최근 5분 관리 API 요청이 20건 이상이고 2초 초과 응답 비율이 5%를 넘는 상태가 5분간 지속되었습니다. DB 잠금과 연결 풀, JWK 조회 지연을 확인하세요.

      - alert: BatonGoHttpServerErrors
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_count{job="baton-go",status=~"5..",uri!~"/actuator.*|/livez|/readyz"}[5m]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="baton-go",status!="429",uri!~"/actuator.*|/livez|/readyz"}[5m]))
          ) > 0.05
          and
          sum by (job) (increase(http_server_requests_seconds_count{job="baton-go",status=~"5..",uri!~"/actuator.*|/livez|/readyz"}[5m])) >= 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: BATON GO 서버 오류 증가
          description: 최근 5분간 5xx가 5건 이상이고 429를 제외한 응답의 오류율이 5%를 넘는 상태가 5분간 지속되었습니다. DB 준비 상태와 최근 배포를 확인하세요.

      - alert: BatonGoManagementApiServerErrors
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_count{job="baton-go",uri=~"/api/v1/.*",status=~"5.."}[5m]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="baton-go",uri=~"/api/v1/.*",status!="429"}[5m]))
          ) > 0.05
          and
          sum by (job) (increase(http_server_requests_seconds_count{job="baton-go",uri=~"/api/v1/.*",status=~"5.."}[5m])) >= 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: BATON GO 관리 API 서버 오류 증가
          description: 최근 5분간 관리 API의 5xx가 5건 이상이고 429를 제외한 관리 응답의 오류율이 5%를 넘는 상태가 5분간 지속되었습니다. 관리 작업 로그와 DB 쓰기 권한, 링크 코드 설정과 최근 배포를 확인하세요.

      - alert: BatonGoManagementAuthenticationServiceFailure
        expr: |
          sum by (job) (increase(baton_go_management_authentication_service_failures_total{job="baton-go"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: BATON GO 관리 인증 서비스 장애
          description: 최근 5분간 관리 JWT 검증 서비스 장애가 관측되었습니다. requestId로 로그를 확인하고 발급자 상태와 Pod의 JWK HTTPS 접근을 점검하세요.

      - alert: BatonGoManagementLinkRecoveryFailure
        expr: |
          sum by (job, code) (increase(baton_go_management_link_recovery_failures_total{job="baton-go"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: BATON GO 관리 링크 복구 필요
          description: 최근 5분간 {{ $labels.code }} 오류가 관측되었습니다. requestId로 로그를 확인하고 생성 예약·링크 데이터·HMAC 키·최초 공개 출처를 점검하세요. 같은 요청을 반복하기 전에 해당 오류의 복구 절차를 따르세요.

      - alert: BatonGoPublicResolverRateLimited
        expr: |
          sum by (job) (increase(http_server_requests_seconds_count{job="baton-go",method=~"GET|HEAD",status="429"}[5m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: BATON GO 공개 링크 요청 제한 지속
          description: 최근 5분간 GET·HEAD의 429가 10건 이상인 상태가 5분간 지속되었습니다. 유입량과 Ingress·인스턴스 요청률 제한을 확인하세요.

      - alert: BatonGoStoredTargetContractViolation
        expr: |
          sum by (job) (increase(baton_go_public_resolver_target_contract_violations_total{job="baton-go"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: BATON GO 저장 대상 계약 위반
          description: 공개 링크 해석 중 저장된 대상 계약 위반이 발생했습니다. 허용된 linkId·requestId로 로그를 확인하고 대상 계약 정리 절차를 따르세요.

      - alert: BatonGoLinkRetentionFailure
        expr: |
          sum by (job) (increase(baton_go_link_retention_failures_total{job="baton-go"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: BATON GO 링크 정리 실패
          description: 보존 기간이 지난 링크 정리에 실패했습니다. DB 상태와 정리 예외 종류를 확인하세요. 실패한 묶음은 다음 실행에서 재시도합니다.

      - alert: BatonGoLinkRetentionSchedulerStalled
        expr: |
          (
            time() - baton_go_link_retention_scheduler_heartbeat_seconds{job="baton-go"}
          ) > clamp_min(
            3 * baton_go_link_retention_scheduler_interval_seconds{job="baton-go"},
            180
          )
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: BATON GO 링크 정리 실행 정체
          description: 자동 정리 실행 완료 신호가 설정 간격의 3배(최소 3분) 동안 갱신되지 않았습니다. Pod의 스케줄러 스레드와 DB 쿼리 실행 시간을 확인하세요.

      - alert: BatonGoDistributedResolverQuotaFailure
        expr: |
          sum by (job) (increase(baton_go_public_resolver_quota_failures_total{job="baton-go"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: BATON GO 공용 요청 제한 장애
          description: Redis 공용 제한을 확인하지 못해 공개 링크 요청을 503으로 차단했습니다. Redis 연결·TLS·ACL·메모리 상태를 확인하세요.
